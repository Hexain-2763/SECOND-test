<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Links</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #0c1e4e, #41649d);
      color: #b7e1ff;
      overflow: hidden;
    }

    .card {
      padding: 2rem 2.5rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: floatIn 1s ease-out;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 2rem;
      animation: pulse 2s infinite ease-in-out;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin: 0.8rem 0;
    }

    a {
      display: inline-block;
      padding: 0.7rem 1.2rem;
      border-radius: 999px;
      color: white;
      text-decoration: none;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 25px rgba(10, 10, 10, 0.5);
    }

    a:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.03);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Project Pages</h1>
    <ul>
      <li><a href="./web1/index.html">Web 1</a></li>
      <li><a href="./web2/index.html">Web 2</a></li>
      <li><a href="./GAMES/3D-Game.html">3D Game</a></li>
      <li><a href="./GAMES/pong.html">Pong</a></li>
      <li><a href="./GAMES/simple-game.html">Simple Game</a></li>
    </ul>
  </div>
</body>
</html>
