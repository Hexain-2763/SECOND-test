<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.8; }
    .status { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; margin-left: auto; }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .bot {
      align-self: flex-start;
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(168,85,247,0.15));
      border: 1px solid rgba(139,92,246,0.2);
      border-bottom-left-radius: 4px;
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-bottom-right-radius: 4px;
      color: white;
    }

    .bot ul { margin: 8px 0; padding-left: 20px; }
    .bot li { margin: 4px 0; }
    .bot strong { color: #c4b5fd; }

    .quick-actions {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 0 20px 12px;
    }
    .quick-actions button {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(139,92,246,0.3);
      background: rgba(139,92,246,0.1);
      color: #c4b5fd;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-actions button:hover {
      background: rgba(139,92,246,0.25);
      border-color: rgba(139,92,246,0.5);
    }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(15,15,26,0.9);
      backdrop-filter: blur(12px);
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-area input:focus { border-color: rgba(139,92,246,0.5); }
    .input-area input::placeholder { color: rgba(255,255,255,0.3); }

    .input-area button {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .input-area button:hover { opacity: 0.85; }
    .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

    .typing { display: none; padding: 0 20px 8px; font-size: 12px; color: #888; }
    .typing.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">💬</div>
    <div>
      <h1>Customer Support</h1>
      <p>We typically reply instantly</p>
    </div>
    <div class="status"></div>
  </div>

  <div class="chat-container" id="chat"></div>

  <div class="typing" id="typing">Bot is typing...</div>

  <div class="quick-actions" id="quick-actions">
    <button onclick="sendQuick('Track my order')">📦 Track Order</button>
    <button onclick="sendQuick('Return policy')">↩️ Returns</button>
    <button onclick="sendQuick('Shipping info')">🚚 Shipping</button>
    <button onclick="sendQuick('Payment methods')">💳 Payment</button>
    <button onclick="sendQuick('Reset password')">🔑 Account</button>
    <button onclick="sendQuick('Warranty claim')">🛡️ Warranty</button>
    <button onclick="sendQuick('Cancel my order')">❌ Cancel Order</button>
    <button onclick="sendQuick('Contact support')">🧑‍💼 Human Agent</button>
  </div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('user-input');
    const typing = document.getElementById('typing');

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.innerHTML = formatText(text);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function formatText(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*?<\/li>[\n]*)+/g, m => `<ul>${m}</ul>`)
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
    }

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;

      addMessage(msg, 'user');
      input.value = '';
      typing.classList.add('show');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        typing.classList.remove('show');
        addMessage(data.reply, 'bot');
      } catch {
        typing.classList.remove('show');
        addMessage('Sorry, something went wrong. Please try again.', 'bot');
      }
    }

    function sendQuick(text) {
      input.value = text;
      sendMessage();
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });

    addMessage("Hello! I'm your virtual assistant. How can I help you today?", 'bot');
  </script>
</body>
</html>
