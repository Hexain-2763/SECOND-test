<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Consolas, monospace;
    }
    canvas {
      display: block;
      border: 2px solid #333;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="500"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;

    const BALL_SIZE = 15, PAD_W = 10, PAD_H = 80;
    const PADDLE_SPEED = 6, BALL_SPEED = 5, WIN_SCORE = 7;

    let score1 = 0, score2 = 0;
    let bx, by, bdx, bdy;
    let p1y, p2y;
    const pressed = {};
    let running = true;

    function resetPositions() {
      p1y = H / 2 - PAD_H / 2;
      p2y = H / 2 - PAD_H / 2;
      bx = W / 2 - BALL_SIZE / 2;
      by = H / 2 - BALL_SIZE / 2;
    }

    function serve() {
      bdx = BALL_SPEED * (Math.random() < 0.5 ? -1 : 1);
      bdy = BALL_SPEED * (Math.random() < 0.5 ? -1 : 1);
    }

    function movePaddles() {
      if (pressed["w"] || pressed["W"]) p1y = Math.max(0, p1y - PADDLE_SPEED);
      if (pressed["s"] || pressed["S"]) p1y = Math.min(H - PAD_H, p1y + PADDLE_SPEED);
      if (pressed["ArrowUp"]) p2y = Math.max(0, p2y - PADDLE_SPEED);
      if (pressed["ArrowDown"]) p2y = Math.min(H - PAD_H, p2y + PADDLE_SPEED);
    }

    function moveBall() {
      bx += bdx;
      by += bdy;
      if (by <= 0 || by + BALL_SIZE >= H) {
        bdy = -bdy;
        by = Math.max(0, Math.min(by, H - BALL_SIZE));
      }
      // paddle collisions
      const ball = [bx, by, bx + BALL_SIZE, by + BALL_SIZE];
      const pads = [[30, p1y, 30 + PAD_W, p1y + PAD_H], [W - 30 - PAD_W, p2y, W - 30, p2y + PAD_H]];
      for (const pad of pads) {
        if (ball[2] > pad[0] && ball[0] < pad[2] && ball[3] > pad[1] && ball[1] < pad[3]) {
          bdx = -bdx;
          const overlap = (ball[1] + ball[3]) / 2 - (pad[1] + pad[3]) / 2;
          bdy = overlap * 0.2;
          if (Math.abs(bdy) < 2) bdy = bdy >= 0 ? 2 : -2;
          break;
        }
      }
    }

    function checkScore() {
      if (bx < 0) { score2++; return true; }
      if (bx > W) { score1++; return true; }
      return false;
    }

    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);

      // center line
      ctx.setLineDash([10, 10]);
      ctx.strokeStyle = "gray";
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);

      // score
      ctx.fillStyle = "white";
      ctx.font = "36px Consolas";
      ctx.textAlign = "center";
      ctx.fillText(`${score1} : ${score2}`, W / 2, 40);

      // paddles
      ctx.fillStyle = "cyan";
      ctx.fillRect(30, p1y, PAD_W, PAD_H);
      ctx.fillStyle = "magenta";
      ctx.fillRect(W - 30 - PAD_W, p2y, PAD_W, PAD_H);

      // ball
      ctx.fillStyle = "white";
      ctx.fillRect(bx, by, BALL_SIZE, BALL_SIZE);

      if (!running) {
        ctx.fillStyle = "yellow";
        ctx.font = "40px Consolas";
        ctx.fillText(`Player ${score1 >= WIN_SCORE ? 1 : 2} Wins!`, W / 2, H / 2);
        ctx.fillStyle = "gray";
        ctx.font = "16px Consolas";
        ctx.fillText("Press R to restart", W / 2, H / 2 + 50);
      }
    }

    function gameLoop() {
      if (running) {
        movePaddles();
        moveBall();
        if (checkScore()) {
          if (score1 >= WIN_SCORE || score2 >= WIN_SCORE) { running = false; }
          else { resetPositions(); serve(); }
        }
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", e => {
      pressed[e.key] = true;
      if (e.key === "r" || e.key === "R") {
        score1 = 0; score2 = 0; running = true;
        resetPositions(); serve();
      }
    });
    document.addEventListener("keyup", e => { pressed[e.key] = false; });

    resetPositions();
    serve();
    gameLoop();
  </script>
</body>
</html>
