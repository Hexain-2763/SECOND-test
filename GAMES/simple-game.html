<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siege Survival</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #f7f7f7;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .wrap {
      width: min(96vw, 980px);
      display: grid;
      gap: 10px;
    }

    canvas {
      width: 100%;
      height: auto;
      border: 4px solid #2a2a2a;
      background: #1b1b1b;
      cursor: crosshair;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #1f1f1f;
      border: 2px solid #2d2d2d;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div>Defend the city</div>
      <div>Score: <span id="score">0</span> | City HP: <span id="hp">100</span></div>
    </div>
    <canvas id="game" width="960" height="540"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hpEl = document.getElementById('hp');

    const state = {
      mouseX: canvas.width * 0.8,
      mouseY: canvas.height * 0.8,
      score: 0,
      cityHp: 100,
      bullets: [],
      enemies: [],
      player: {
        x: canvas.width * 0.8,
        y: canvas.height * 0.8,
        radius: 18,
        speed: 180,
        vx: 0,
        vy: 0
      },
      city: {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 120
      },
      keys: {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false,
        KeyW: false,
        KeyA: false,
        KeyS: false,
        KeyD: false
      },
      spawnTimer: 0,
      spawnDelay: 1.2,
      lastTime: 0,
      gameOver: false
    };

    canvas.addEventListener('mousemove', (event) => {
      const rect = canvas.getBoundingClientRect();
      state.mouseX = ((event.clientX - rect.left) / rect.width) * canvas.width;
      state.mouseY = ((event.clientY - rect.top) / rect.height) * canvas.height;
    });

    canvas.addEventListener('mousedown', () => {
      if (!state.gameOver) shoot();
    });

    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        if (!state.gameOver) shoot();
      }
      if (event.code in state.keys) {
        state.keys[event.code] = true;
      }
    });

    window.addEventListener('keyup', (event) => {
      if (event.code in state.keys) {
        state.keys[event.code] = false;
      }
    });

    function shoot() {
      const dx = state.mouseX - state.player.x;
      const dy = state.mouseY - state.player.y;
      const dist = Math.hypot(dx, dy) || 1;
      state.bullets.push({
        x: state.player.x,
        y: state.player.y,
        vx: (dx / dist) * 550,
        vy: (dy / dist) * 550,
        radius: 5,
        life: 1.2
      });
    }

    function spawnEnemy() {
      const y = 60 + Math.random() * (canvas.height - 120);
      state.enemies.push({
        x: -20,
        y,
        radius: 12 + Math.random() * 6,
        speed: 55 + Math.random() * 25,
        hp: 1
      });
    }

    function update(dt) {
      if (state.gameOver) return;

      state.spawnTimer += dt;
      if (state.spawnTimer >= state.spawnDelay) {
        state.spawnTimer = 0;
        spawnEnemy();
        state.spawnDelay = Math.max(0.55, state.spawnDelay - 0.01);
      }

      for (let i = state.bullets.length - 1; i >= 0; i--) {
        const bullet = state.bullets[i];
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        bullet.life -= dt;

        if (bullet.life <= 0 || bullet.x < -20 || bullet.x > canvas.width + 20 || bullet.y < -20 || bullet.y > canvas.height + 20) {
          state.bullets.splice(i, 1);
          continue;
        }

        for (let j = state.enemies.length - 1; j >= 0; j--) {
          const enemy = state.enemies[j];
          const dx = bullet.x - enemy.x;
          const dy = bullet.y - enemy.y;
          if (Math.hypot(dx, dy) <= bullet.radius + enemy.radius) {
            enemy.hp -= 1;
            state.bullets.splice(i, 1);
            if (enemy.hp <= 0) {
              state.enemies.splice(j, 1);
              state.score += 10;
            }
            break;
          }
        }
      }

      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const enemy = state.enemies[i];
        enemy.x += enemy.speed * dt;

        if (enemy.x > canvas.width * 0.72) {
          state.enemies.splice(i, 1);
          state.cityHp -= 10;
          if (state.cityHp <= 0) {
            state.cityHp = 0;
            state.gameOver = true;
          }
        }
      }

      const inputX = (state.keys.ArrowRight || state.keys.KeyD ? 1 : 0) - (state.keys.ArrowLeft || state.keys.KeyA ? 1 : 0);
      const inputY = (state.keys.ArrowDown || state.keys.KeyS ? 1 : 0) - (state.keys.ArrowUp || state.keys.KeyW ? 1 : 0);
      const inputLength = Math.hypot(inputX, inputY) || 1;
      state.player.vx = (inputX / inputLength) * state.player.speed;
      state.player.vy = (inputY / inputLength) * state.player.speed;
      state.player.x += state.player.vx * dt;
      state.player.y += state.player.vy * dt;

      state.player.x = Math.max(state.player.radius, Math.min(canvas.width - state.player.radius, state.player.x));
      state.player.y = Math.max(state.player.radius, Math.min(canvas.height - state.player.radius, state.player.y));

      scoreEl.textContent = state.score;
      hpEl.textContent = state.cityHp;
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#2b1515';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const city = state.city;
      const redRadius = city.radius + 170;

      ctx.fillStyle = '#772f2f';
      ctx.beginPath();
      ctx.arc(city.x, city.y, redRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.beginPath();
      ctx.arc(city.x, city.y, redRadius - 18, 0, Math.PI * 2);
      ctx.fill();

      const blueGradient = ctx.createRadialGradient(city.x, city.y, city.radius * 0.2, city.x, city.y, city.radius);
      blueGradient.addColorStop(0, '#e3f4ff');
      blueGradient.addColorStop(1, '#1f4d79');
      ctx.fillStyle = blueGradient;
      ctx.beginPath();
      ctx.arc(city.x, city.y, city.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#8fc6ff';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(city.x, city.y, city.radius + 8, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('CITY CORE', city.x, city.y - 10);
      ctx.font = '16px Arial';
      ctx.fillText('Protect this blue area', city.x, city.y + 18);

      ctx.fillStyle = '#ffdada';
      ctx.font = '18px Arial';
      ctx.fillText('RED DANGER ZONE', city.x, city.y + redRadius + 40);
    }

    function drawPlayer() {
      const p = state.player;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = '#e6e6e6';
      ctx.beginPath();
      ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
      ctx.fill();

      const dx = state.mouseX - p.x;
      const dy = state.mouseY - p.y;
      const angle = Math.atan2(dy, dx);
      ctx.strokeStyle = '#ffdf66';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(angle) * 24, Math.sin(angle) * 24);
      ctx.stroke();
      ctx.restore();
    }

    function drawBullets() {
      ctx.fillStyle = '#ffd166';
      state.bullets.forEach((b) => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawEnemies() {
      state.enemies.forEach((enemy) => {
        ctx.fillStyle = '#c95b5b';
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(enemy.x - 5, enemy.y - 2, 10, 4);
      });
    }

    function drawOverlay() {
      if (!state.gameOver) return;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 42px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('The city fell...', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '24px Arial';
      ctx.fillText('Refresh to try again', canvas.width / 2, canvas.height / 2 + 30);
    }

    function loop(time) {
      const dt = Math.min(0.032, (time - state.lastTime) / 1000 || 0.016);
      state.lastTime = time;
      update(dt);
      drawBackground();
      drawEnemies();
      drawBullets();
      drawPlayer();
      drawOverlay();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
