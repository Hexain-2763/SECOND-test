<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siege Survival</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #f7f7f7;
    }

    .wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #111;
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(31, 31, 31, 0.9);
      border-bottom: 2px solid #2d2d2d;
      font-size: 14px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div>Defend the city</div>
      <div>
        Casualties: <span style="color:#7bb36b">Blue</span> <span id="blueCasualties">0</span>
        : <span id="redCasualties">0</span> <span style="color:#c95b5b">Red</span>
        | City HP: <span id="hp">100</span>
        | Wall HP: <span id="wall">420</span>
        | Charge: <span id="charge">0%</span>
      </div>
    </div>
    <canvas id="game"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const blueCasualtiesEl = document.getElementById('blueCasualties');
    const redCasualtiesEl = document.getElementById('redCasualties');
    const hpEl = document.getElementById('hp');

    function resizeCanvas() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    resizeCanvas();

    const state = {
      mouseX: canvas.width * 0.8,
      mouseY: canvas.height * 0.8,
      blueCasualties: 0,
      redCasualties: 0,
      cityHp: 100,
      bullets: [],
      enemies: [],
      allies: [],
      alliedShots: [],
      territory: [],
      player: {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 18,
        speed: 180,
        vx: 0,
        vy: 0,
        charging: false,
        chargeTime: 0,
        maxCharge: 1.5,
        cooldown: 0,
        maxCooldown: 0.75,
        weapon: 'longbow'
      },
      city: {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 220,
        shape: [],
        wallRadius: 260,
        wallHp: 420,
        wallMaxHp: 420,
        wallsDown: false,
        collapsing: false,
        collapseTimer: 0,
        collapseDuration: 2.2
      },
      keys: {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false,
        KeyW: false,
        KeyA: false,
        KeyS: false,
        KeyD: false
      },
      spawnTimer: 0,
      spawnDelay: 2.0,
      lastTime: 0,
      gameOver: false
    };

    window.addEventListener('resize', resizeCanvas);

    canvas.addEventListener('mousemove', (event) => {
      const rect = canvas.getBoundingClientRect();
      state.mouseX = ((event.clientX - rect.left) / rect.width) * canvas.width;
      state.mouseY = ((event.clientY - rect.top) / rect.height) * canvas.height;
    });

    function createAllies() {
      const count = 10;
      const ringRadius = state.city.wallRadius + 70;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.3;
        state.allies.push({
          x: state.city.x + Math.cos(angle) * ringRadius,
          y: state.city.y + Math.sin(angle) * ringRadius,
          radius: 14,
          hp: 14,
          speed: 72,
          attackCooldown: 0,
          attackRate: 0.9,
          weapon: 'crossbow'
        });
      }
    }

    function createTerritory() {
      state.territory = [];
      const count = 24;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.15;
        const radius = state.city.wallRadius + 70 + Math.random() * 60;
        state.territory.push({
          x: state.city.x + Math.cos(angle) * radius,
          y: state.city.y + Math.sin(angle) * radius,
          owner: 'neutral'
        });
      }
    }

    function spawnInitialEnemies() {
      const count = 16;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.25;
        const spawnRadius = state.city.wallRadius + 70 + Math.random() * 30;
        state.enemies.push({
          x: state.city.x + Math.cos(angle) * spawnRadius,
          y: state.city.y + Math.sin(angle) * spawnRadius,
          radius: 16 + Math.random() * 6,
          speed: 24 + Math.random() * 6,
          hp: 8,
          atWall: false,
          attackTimer: 0,
          attackRate: 1.4,
          weapon: Math.random() < 0.5 ? 'spear' : 'bow'
        });
      }
    }

    createAllies();
    createTerritory();
    spawnInitialEnemies();

    canvas.addEventListener('mousedown', (event) => {
      if (event.button === 0 && !state.gameOver) {
        state.player.charging = true;
      }
    });

    canvas.addEventListener('mouseup', (event) => {
      if (event.button === 0 && state.player.charging && !state.gameOver) {
        shoot();
        state.player.charging = false;
        state.player.chargeTime = 0;
      }
    });

    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        if (!state.gameOver) {
          state.player.charging = true;
        }
      }
      if (event.code in state.keys) {
        state.keys[event.code] = true;
      }
    });

    window.addEventListener('keyup', (event) => {
      if (event.code === 'Space' && state.player.charging && !state.gameOver) {
        shoot();
        state.player.charging = false;
        state.player.chargeTime = 0;
      }
      if (event.code in state.keys) {
        state.keys[event.code] = false;
      }
    });

    function shoot() {
      if (state.player.cooldown > 0) return;
      const dx = state.mouseX - state.player.x;
      const dy = state.mouseY - state.player.y;
      const dist = Math.hypot(dx, dy) || 1;
      const charge = Math.min(state.player.chargeTime / state.player.maxCharge, 1);
      const power = 1 + Math.round(charge * 4);
      const speed = 420 + charge * 180;
      state.bullets.push({
        x: state.player.x,
        y: state.player.y,
        vx: (dx / dist) * speed,
        vy: (dy / dist) * speed,
        radius: 5 + charge * 3,
        life: 1.6,
        power
      });
      state.player.cooldown = state.player.maxCooldown;
    }

    function spawnEnemy() {
      const angle = Math.random() * Math.PI * 2;
      const spawnRadius = state.city.wallRadius + 320;
      const x = state.city.x + Math.cos(angle) * spawnRadius;
      const y = state.city.y + Math.sin(angle) * spawnRadius;
      state.enemies.push({
        x,
        y,
        radius: 16 + Math.random() * 6,
        speed: 24 + Math.random() * 6,
        hp: 8,
        atWall: false,
        attackTimer: 0,
        attackRate: 1.4,
        weapon: Math.random() < 0.5 ? 'spear' : 'bow'
      });
    }

    function updateHud() {
      blueCasualtiesEl.textContent = state.blueCasualties;
      redCasualtiesEl.textContent = state.redCasualties;
      hpEl.textContent = state.cityHp;
      document.getElementById('wall').textContent = Math.max(0, Math.ceil(state.city.wallHp));
      const bowReady = state.player.cooldown <= 0;
      document.getElementById('charge').textContent = `${Math.round((state.player.chargeTime / state.player.maxCharge) * 100)}%${bowReady ? ' • Ready' : ` • ${state.player.cooldown.toFixed(2)}s`}`;
    }

    function update(dt) {
      if (state.gameOver) return;

      state.spawnTimer += dt;
      if (!state.city.collapsing && state.spawnTimer >= state.spawnDelay) {
        state.spawnTimer = 0;
        spawnEnemy();
        state.spawnDelay = Math.max(1.2, state.spawnDelay - 0.02);
      }

      for (let i = state.bullets.length - 1; i >= 0; i--) {
        const bullet = state.bullets[i];
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        bullet.life -= dt;

        if (bullet.life <= 0 || bullet.x < -20 || bullet.x > canvas.width + 20 || bullet.y < -20 || bullet.y > canvas.height + 20) {
          state.bullets.splice(i, 1);
          continue;
        }

        for (let j = state.enemies.length - 1; j >= 0; j--) {
          const enemy = state.enemies[j];
          const dx = bullet.x - enemy.x;
          const dy = bullet.y - enemy.y;
          if (Math.hypot(dx, dy) <= bullet.radius + enemy.radius) {
            enemy.hp -= bullet.power;
            state.bullets.splice(i, 1);
            if (enemy.hp <= 0) {
              state.enemies.splice(j, 1);
              state.redCasualties += 1;
            }
            break;
          }
        }
      }

      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const enemy = state.enemies[i];
        const dx = state.city.x - enemy.x;
        const dy = state.city.y - enemy.y;
        const dist = Math.hypot(dx, dy) || 1;
        const wallDist = state.city.wallRadius + enemy.radius;

        if (!enemy.atWall && dist <= wallDist) {
          enemy.atWall = true;
          enemy.x = state.city.x - (dx / dist) * wallDist;
          enemy.y = state.city.y - (dy / dist) * wallDist;
          enemy.attackTimer = 0;
        }

        if (!enemy.atWall) {
          enemy.x += (dx / dist) * enemy.speed * dt;
          enemy.y += (dy / dist) * enemy.speed * dt;
        }

        let enemyHitAlly = false;
        for (let j = state.allies.length - 1; j >= 0; j--) {
          const ally = state.allies[j];
          const ax = ally.x - enemy.x;
          const ay = ally.y - enemy.y;
          const adist = Math.hypot(ax, ay) || 1;
          if (adist <= enemy.radius + ally.radius) {
            ally.hp -= 18 * dt;
            enemy.hp -= 9 * dt;
            enemyHitAlly = true;
            if (ally.hp <= 0) {
              state.allies.splice(j, 1);
              state.blueCasualties += 1;
            }
          }
        }

        if (enemy.hp <= 0) {
          state.enemies.splice(i, 1);
          state.redCasualties += 1;
          continue;
        }

        if (enemy.atWall && !enemyHitAlly) {
          enemy.attackTimer += dt;
          if (enemy.attackTimer >= enemy.attackRate) {
            enemy.attackTimer = 0;
            if (!state.city.wallsDown) {
              state.city.wallHp -= 18;
              if (state.city.wallHp <= 0) {
                state.city.wallHp = 0;
                state.city.wallsDown = true;
              }
            } else {
              state.cityHp -= 4;
              if (state.cityHp <= 0) {
                state.cityHp = 0;
                state.gameOver = true;
              }
            }
          }
        }
      }

      const inputX = (state.keys.ArrowRight || state.keys.KeyD ? 1 : 0) - (state.keys.ArrowLeft || state.keys.KeyA ? 1 : 0);
      const inputY = (state.keys.ArrowDown || state.keys.KeyS ? 1 : 0) - (state.keys.ArrowUp || state.keys.KeyW ? 1 : 0);
      const inputLength = Math.hypot(inputX, inputY) || 1;
      state.player.vx = (inputX / inputLength) * state.player.speed;
      state.player.vy = (inputY / inputLength) * state.player.speed;
      state.player.x += state.player.vx * dt;
      state.player.y += state.player.vy * dt;

      const dx = state.player.x - state.city.x;
      const dy = state.player.y - state.city.y;
      const currentDist = Math.hypot(dx, dy);
      const maxDist = state.city.radius - state.player.radius - 3;
      if (currentDist > maxDist) {
        const scale = maxDist / currentDist;
        state.player.x = state.city.x + dx * scale;
        state.player.y = state.city.y + dy * scale;
      }

      if (state.player.cooldown > 0) {
        state.player.cooldown = Math.max(0, state.player.cooldown - dt);
      }

      if (state.player.charging) {
        state.player.chargeTime = Math.min(state.player.chargeTime + dt, state.player.maxCharge);
      }

      if (state.city.collapsing) {
        state.city.collapseTimer += dt;
        if (state.city.collapseTimer >= state.city.collapseDuration) {
          state.gameOver = true;
        }
      }

      updateHud();
    }

    function updateAllies(dt) {
      for (let i = state.allies.length - 1; i >= 0; i--) {
        const ally = state.allies[i];
        if (ally.hp <= 0) {
          state.allies.splice(i, 1);
          continue;
        }

        if (ally.attackCooldown > 0) {
          ally.attackCooldown -= dt;
        }

        let target = null;
        let nearest = Infinity;
        for (const enemy of state.enemies) {
          if (enemy.atWall) continue;
          const dx = enemy.x - ally.x;
          const dy = enemy.y - ally.y;
          const dist = Math.hypot(dx, dy);
          if (dist < nearest) {
            nearest = dist;
            target = enemy;
          }
        }

        if (target) {
          const dx = target.x - ally.x;
          const dy = target.y - ally.y;
          const dist = Math.hypot(dx, dy) || 1;
          const speed = ally.speed * (dist > ally.radius + target.radius + 12 ? 1 : 0.45);
          ally.x += (dx / dist) * speed * dt;
          ally.y += (dy / dist) * speed * dt;

          if (dist <= ally.radius + target.radius + 120 && ally.attackCooldown <= 0) {
            const shotDx = target.x - ally.x;
            const shotDy = target.y - ally.y;
            const shotDist = Math.hypot(shotDx, shotDy) || 1;
            state.alliedShots.push({
              x: ally.x,
              y: ally.y,
              vx: (shotDx / shotDist) * 360,
              vy: (shotDy / shotDist) * 360,
              radius: 3,
              life: 1.1
            });
            ally.attackCooldown = ally.attackRate;
          }
        }

        const dx = ally.x - state.city.x;
        const dy = ally.y - state.city.y;
        const dist = Math.hypot(dx, dy);
        const maxDist = state.city.wallRadius + 130;
        if (dist > maxDist) {
          const scale = maxDist / dist;
          ally.x = state.city.x + dx * scale;
          ally.y = state.city.y + dy * scale;
        }
      }
    }

    function updateAlliedShots(dt) {
      for (let i = state.alliedShots.length - 1; i >= 0; i--) {
        const shot = state.alliedShots[i];
        shot.x += shot.vx * dt;
        shot.y += shot.vy * dt;
        shot.life -= dt;
        if (shot.life <= 0) {
          state.alliedShots.splice(i, 1);
          continue;
        }
        for (let j = state.enemies.length - 1; j >= 0; j--) {
          const enemy = state.enemies[j];
          const dx = shot.x - enemy.x;
          const dy = shot.y - enemy.y;
          if (Math.hypot(dx, dy) <= shot.radius + enemy.radius) {
            enemy.hp -= 4;
            state.alliedShots.splice(i, 1);
            if (enemy.hp <= 0) {
              state.enemies.splice(j, 1);
              state.redCasualties += 1;
            }
            break;
          }
        }
      }
    }

    function updateTerritory() {
      state.territory.forEach((cell) => {
        let blueScore = 0;
        let redScore = 0;
        for (const ally of state.allies) {
          if (Math.hypot(ally.x - cell.x, ally.y - cell.y) < 90) blueScore += 1;
        }
        for (const enemy of state.enemies) {
          if (Math.hypot(enemy.x - cell.x, enemy.y - cell.y) < 90) redScore += 1;
        }
        if (blueScore > redScore) cell.owner = 'blue';
        else if (redScore > blueScore) cell.owner = 'red';
      });
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#2b1515';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const city = state.city;
      const dangerRadius = city.wallRadius + 24;
      const baseColor = state.gameOver || state.city.collapsing ? '#e25656' : '#d24545';
      const innerColor = state.gameOver || state.city.collapsing ? '#d13f3f' : '#dc5454';
      const cityFill = state.city.collapsing || state.gameOver ? '#c82c2c' : '#2b5cbc';
      const wallStroke = state.gameOver || state.city.collapsing ? '#7b2727' : '#1b3f76';
      const collapseRatio = state.city.collapsing ? Math.min(1, state.city.collapseTimer / state.city.collapseDuration) : 0;

      ctx.fillStyle = baseColor;
      ctx.beginPath();
      ctx.arc(city.x, city.y, dangerRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = innerColor;
      ctx.beginPath();
      ctx.arc(city.x, city.y, city.wallRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2b5cbc';
      ctx.beginPath();
      const segments = 18;
      for (let i = 0; i <= segments; i++) {
        const angle = (Math.PI * 2 / segments) * i;
        const radius = city.radius + Math.sin(i * 1.3) * 12 + Math.cos(i * 1.7) * 8;
        const px = city.x + Math.cos(angle) * radius;
        const py = city.y + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      if (collapseRatio > 0) {
        ctx.fillStyle = `rgba(196, 39, 39, ${collapseRatio * 0.85})`;
        ctx.beginPath();
        for (let i = 0; i <= segments; i++) {
          const angle = (Math.PI * 2 / segments) * i;
          const radius = city.radius + Math.sin(i * 1.3) * 12 + Math.cos(i * 1.7) * 8;
          const px = city.x + Math.cos(angle) * radius;
          const py = city.y + Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      }

      ctx.strokeStyle = wallStroke;
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.arc(city.x, city.y, city.wallRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.setLineDash([14, 8]);
      ctx.beginPath();
      ctx.arc(city.x, city.y, city.wallRadius + 28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(state.gameOver ? 'CITY CAPTURED' : 'CITY CORE', city.x, city.y - 12);
      ctx.font = '16px Arial';
      ctx.fillText(state.gameOver ? 'The city has fallen' : 'Stay inside the blue area', city.x, city.y + 16);

      ctx.fillStyle = '#ffd8d8';
      ctx.font = '18px Arial';
      ctx.fillText(state.gameOver ? 'ALLIES LOST' : 'Attackers approaching!', city.x, city.y + dangerRadius + 30);

      if (state.player.charging) {
        const chargeRatio = state.player.chargeTime / state.player.maxCharge;
        const chargeRadius = 30 + chargeRatio * 20;
        ctx.strokeStyle = `rgba(255, 215, 80, ${0.65 + chargeRatio * 0.25})`;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(state.player.x, state.player.y, chargeRadius, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      const p = state.player;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = '#e6e6e6';
      ctx.beginPath();
      ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
      ctx.fill();

      const dx = state.mouseX - p.x;
      const dy = state.mouseY - p.y;
      const angle = Math.atan2(dy, dx);
      ctx.strokeStyle = '#7a4b1d';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(angle) * 22, Math.sin(angle) * 22);
      ctx.stroke();

      ctx.strokeStyle = '#c7a36a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-4, 6);
      ctx.lineTo(10, -2);
      ctx.stroke();

      ctx.fillStyle = '#3c2a1a';
      ctx.fillRect(-2, -8, 4, 16);
      ctx.restore();
    }

    function drawBullets() {
      ctx.fillStyle = '#ffd166';
      state.bullets.forEach((b) => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawAlliedShots() {
      ctx.fillStyle = '#86c5ff';
      state.alliedShots.forEach((shot) => {
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawTerritory() {
      state.territory.forEach((cell) => {
        const color = cell.owner === 'blue' ? 'rgba(77, 125, 255, 0.28)' : cell.owner === 'red' ? 'rgba(255, 92, 92, 0.28)' : 'rgba(255,255,255,0.08)';
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(cell.x, cell.y, 12, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawEnemies() {
      state.enemies.forEach((enemy) => {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.fillStyle = '#c95b5b';
        ctx.beginPath();
        ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#6f2323';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-6, -2);
        ctx.lineTo(8, -2);
        ctx.stroke();

        if (enemy.weapon === 'bow') {
          ctx.strokeStyle = '#8c5a2b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(5, -7);
          ctx.lineTo(-4, 4);
          ctx.stroke();
        } else {
          ctx.strokeStyle = '#8c5a2b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(8, -4);
          ctx.lineTo(14, -10);
          ctx.stroke();
        }

        ctx.fillStyle = '#fff';
        ctx.fillRect(-5, -2, 10, 4);
        ctx.restore();
      });
    }

    function drawAllies() {
      state.allies.forEach((ally) => {
        ctx.save();
        ctx.translate(ally.x, ally.y);
        ctx.fillStyle = '#7bb36b';
        ctx.beginPath();
        ctx.arc(0, 0, ally.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#e6f3d1';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, ally.radius + 4, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#5f3b1f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(6, -2);
        ctx.lineTo(11, -8);
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawOverlay() {
      if (!state.gameOver) return;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 42px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('The city fell...', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '24px Arial';
      ctx.fillText('Refresh to try again', canvas.width / 2, canvas.height / 2 + 30);
    }

    function loop(time) {
      const dt = Math.min(0.032, (time - state.lastTime) / 1000 || 0.016);
      state.lastTime = time;
      update(dt);
      updateAllies(dt);
      updateAlliedShots(dt);
      updateTerritory();
      drawBackground();
      drawTerritory();
      drawEnemies();
      drawAllies();
      drawAlliedShots();
      drawBullets();
      drawPlayer();
      drawOverlay();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
