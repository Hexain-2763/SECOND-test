<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siege Survival</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #f7f7f7;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .wrap {
      width: min(96vw, 1220px);
      display: grid;
      gap: 10px;
    }

    canvas {
      width: 100%;
      height: auto;
      border: 4px solid #2a2a2a;
      background: #1b1b1b;
      cursor: crosshair;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #1f1f1f;
      border: 2px solid #2d2d2d;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div>Defend the city</div>
      <div>
        Score: <span id="score">0</span>
        | City HP: <span id="hp">100</span>
        | Wall HP: <span id="wall">420</span>
        | Charge: <span id="charge">0%</span>
      </div>
    </div>
    <canvas id="game" width="1160" height="760"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hpEl = document.getElementById('hp');

    const state = {
      mouseX: canvas.width * 0.8,
      mouseY: canvas.height * 0.8,
      score: 0,
      cityHp: 100,
      bullets: [],
      enemies: [],
      allies: [],
      player: {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 18,
        speed: 180,
        vx: 0,
        vy: 0,
        charging: false,
        chargeTime: 0,
        maxCharge: 1.5
      },
      city: {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 220,
        shape: [],
        wallRadius: 260,
        wallHp: 420,
        wallMaxHp: 420,
        collapsing: false,
        collapseTimer: 0,
        collapseDuration: 2.2
      },
      keys: {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false,
        KeyW: false,
        KeyA: false,
        KeyS: false,
        KeyD: false
      },
      spawnTimer: 0,
      spawnDelay: 2.0,
      lastTime: 0,
      gameOver: false
    };

    canvas.addEventListener('mousemove', (event) => {
      const rect = canvas.getBoundingClientRect();
      state.mouseX = ((event.clientX - rect.left) / rect.width) * canvas.width;
      state.mouseY = ((event.clientY - rect.top) / rect.height) * canvas.height;
    });

    function createAllies() {
      const count = 4;
      const innerRadius = state.city.radius - 50;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.4;
        state.allies.push({
          x: state.city.x + Math.cos(angle) * innerRadius,
          y: state.city.y + Math.sin(angle) * innerRadius,
          radius: 16,
          hp: 14,
          speed: 70,
          attackCooldown: 0,
          attackRate: 0.7
        });
      }
    }

    createAllies();

    canvas.addEventListener('mousedown', (event) => {
      if (event.button === 0 && !state.gameOver) {
        state.player.charging = true;
      }
    });

    canvas.addEventListener('mouseup', (event) => {
      if (event.button === 0 && state.player.charging && !state.gameOver) {
        shoot();
        state.player.charging = false;
        state.player.chargeTime = 0;
      }
    });

    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        if (!state.gameOver) {
          state.player.charging = true;
        }
      }
      if (event.code in state.keys) {
        state.keys[event.code] = true;
      }
    });

    window.addEventListener('keyup', (event) => {
      if (event.code === 'Space' && state.player.charging && !state.gameOver) {
        shoot();
        state.player.charging = false;
        state.player.chargeTime = 0;
      }
      if (event.code in state.keys) {
        state.keys[event.code] = false;
      }
    });

    function shoot() {
      const dx = state.mouseX - state.player.x;
      const dy = state.mouseY - state.player.y;
      const dist = Math.hypot(dx, dy) || 1;
      const charge = Math.min(state.player.chargeTime / state.player.maxCharge, 1);
      const power = 1 + Math.round(charge * 4);
      const speed = 420 + charge * 180;
      state.bullets.push({
        x: state.player.x,
        y: state.player.y,
        vx: (dx / dist) * speed,
        vy: (dy / dist) * speed,
        radius: 5 + charge * 3,
        life: 1.6,
        power
      });
    }

    function spawnEnemy() {
      const angle = Math.random() * Math.PI * 2;
      const spawnRadius = state.city.wallRadius + 320;
      const x = state.city.x + Math.cos(angle) * spawnRadius;
      const y = state.city.y + Math.sin(angle) * spawnRadius;
      state.enemies.push({
        x,
        y,
        radius: 16 + Math.random() * 6,
        speed: 28 + Math.random() * 6,
        hp: 6,
        atWall: false
      });
    }

    function update(dt) {
      if (state.gameOver) return;

      state.spawnTimer += dt;
      if (!state.city.collapsing && state.spawnTimer >= state.spawnDelay) {
        state.spawnTimer = 0;
        spawnEnemy();
        state.spawnDelay = Math.max(1.2, state.spawnDelay - 0.02);
      }

      for (let i = state.bullets.length - 1; i >= 0; i--) {
        const bullet = state.bullets[i];
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        bullet.life -= dt;

        if (bullet.life <= 0 || bullet.x < -20 || bullet.x > canvas.width + 20 || bullet.y < -20 || bullet.y > canvas.height + 20) {
          state.bullets.splice(i, 1);
          continue;
        }

        for (let j = state.enemies.length - 1; j >= 0; j--) {
          const enemy = state.enemies[j];
          const dx = bullet.x - enemy.x;
          const dy = bullet.y - enemy.y;
          if (Math.hypot(dx, dy) <= bullet.radius + enemy.radius) {
            enemy.hp -= bullet.power;
            state.bullets.splice(i, 1);
            if (enemy.hp <= 0) {
              state.enemies.splice(j, 1);
              state.score += 10;
            }
            break;
          }
        }
      }

      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const enemy = state.enemies[i];
        const dx = state.city.x - enemy.x;
        const dy = state.city.y - enemy.y;
        const dist = Math.hypot(dx, dy) || 1;
        const wallDist = state.city.wallRadius + enemy.radius;

        if (!enemy.atWall && dist <= wallDist) {
          enemy.atWall = true;
          enemy.x = state.city.x - (dx / dist) * wallDist;
          enemy.y = state.city.y - (dy / dist) * wallDist;
        }

        if (!enemy.atWall) {
          enemy.x += (dx / dist) * enemy.speed * dt;
          enemy.y += (dy / dist) * enemy.speed * dt;
        }

        let enemyHitAlly = false;
        for (let j = state.allies.length - 1; j >= 0; j--) {
          const ally = state.allies[j];
          const ax = ally.x - enemy.x;
          const ay = ally.y - enemy.y;
          const adist = Math.hypot(ax, ay) || 1;
          if (adist <= enemy.radius + ally.radius) {
            ally.hp -= 18 * dt;
            enemy.hp -= 9 * dt;
            enemyHitAlly = true;
            if (ally.hp <= 0) {
              state.allies.splice(j, 1);
            }
          }
        }

        if (enemy.hp <= 0) {
          state.enemies.splice(i, 1);
          state.score += 15;
          continue;
        }

        if (enemy.atWall && !enemyHitAlly) {
          state.city.wallHp -= 12 * dt;
          if (state.city.wallHp <= 0) {
            state.city.wallHp = 0;
            state.city.collapsing = true;
            state.city.collapseTimer = 0;
          }
        }
      }

      const inputX = (state.keys.ArrowRight || state.keys.KeyD ? 1 : 0) - (state.keys.ArrowLeft || state.keys.KeyA ? 1 : 0);
      const inputY = (state.keys.ArrowDown || state.keys.KeyS ? 1 : 0) - (state.keys.ArrowUp || state.keys.KeyW ? 1 : 0);
      const inputLength = Math.hypot(inputX, inputY) || 1;
      state.player.vx = (inputX / inputLength) * state.player.speed;
      state.player.vy = (inputY / inputLength) * state.player.speed;
      state.player.x += state.player.vx * dt;
      state.player.y += state.player.vy * dt;

      const dx = state.player.x - state.city.x;
      const dy = state.player.y - state.city.y;
      const currentDist = Math.hypot(dx, dy);
      const maxDist = state.city.radius - state.player.radius - 3;
      if (currentDist > maxDist) {
        const scale = maxDist / currentDist;
        state.player.x = state.city.x + dx * scale;
        state.player.y = state.city.y + dy * scale;
      }

      if (state.player.charging) {
        state.player.chargeTime = Math.min(state.player.chargeTime + dt, state.player.maxCharge);
      }

      if (state.city.collapsing) {
        state.city.collapseTimer += dt;
        if (state.city.collapseTimer >= state.city.collapseDuration) {
          state.gameOver = true;
        }
      }

      scoreEl.textContent = state.score;
      hpEl.textContent = state.cityHp;
      document.getElementById('wall').textContent = Math.max(0, Math.ceil(state.city.wallHp));
      document.getElementById('charge').textContent = `${Math.round((state.player.chargeTime / state.player.maxCharge) * 100)}%`;
    }

    function updateAllies(dt) {
      for (let i = state.allies.length - 1; i >= 0; i--) {
        const ally = state.allies[i];
        if (ally.hp <= 0) {
          state.allies.splice(i, 1);
          continue;
        }

        if (ally.attackCooldown > 0) {
          ally.attackCooldown -= dt;
        }

        let target = null;
        let nearest = Infinity;
        for (const enemy of state.enemies) {
          if (enemy.atWall) continue;
          const dx = enemy.x - ally.x;
          const dy = enemy.y - ally.y;
          const dist = Math.hypot(dx, dy);
          if (dist < nearest) {
            nearest = dist;
            target = enemy;
          }
        }

        if (target) {
          const dx = target.x - ally.x;
          const dy = target.y - ally.y;
          const dist = Math.hypot(dx, dy) || 1;
          const speed = ally.speed * (dist > ally.radius + target.radius + 10 ? 1 : 0.4);
          ally.x += (dx / dist) * speed * dt;
          ally.y += (dy / dist) * speed * dt;

          if (dist <= ally.radius + target.radius + 3 && ally.attackCooldown <= 0) {
            target.hp -= 12;
            ally.attackCooldown = ally.attackRate;
          }
        }

        const dx = ally.x - state.city.x;
        const dy = ally.y - state.city.y;
        const dist = Math.hypot(dx, dy);
        const maxDist = state.city.radius - ally.radius - 8;
        if (dist > maxDist) {
          const scale = maxDist / dist;
          ally.x = state.city.x + dx * scale;
          ally.y = state.city.y + dy * scale;
        }
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#2b1515';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const city = state.city;
      const dangerRadius = city.wallRadius + 24;
      const baseColor = state.gameOver || state.city.collapsing ? '#e25656' : '#d24545';
      const innerColor = state.gameOver || state.city.collapsing ? '#d13f3f' : '#dc5454';
      const cityFill = state.city.collapsing || state.gameOver ? '#c82c2c' : '#2b5cbc';
      const wallStroke = state.gameOver || state.city.collapsing ? '#7b2727' : '#1b3f76';
      const collapseRatio = state.city.collapsing ? Math.min(1, state.city.collapseTimer / state.city.collapseDuration) : 0;

      ctx.fillStyle = baseColor;
      ctx.beginPath();
      ctx.arc(city.x, city.y, dangerRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = innerColor;
      ctx.beginPath();
      ctx.arc(city.x, city.y, city.wallRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2b5cbc';
      ctx.beginPath();
      const segments = 18;
      for (let i = 0; i <= segments; i++) {
        const angle = (Math.PI * 2 / segments) * i;
        const radius = city.radius + Math.sin(i * 1.3) * 12 + Math.cos(i * 1.7) * 8;
        const px = city.x + Math.cos(angle) * radius;
        const py = city.y + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      if (collapseRatio > 0) {
        ctx.fillStyle = `rgba(196, 39, 39, ${collapseRatio * 0.85})`;
        ctx.beginPath();
        for (let i = 0; i <= segments; i++) {
          const angle = (Math.PI * 2 / segments) * i;
          const radius = city.radius + Math.sin(i * 1.3) * 12 + Math.cos(i * 1.7) * 8;
          const px = city.x + Math.cos(angle) * radius;
          const py = city.y + Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      }

      ctx.strokeStyle = wallStroke;
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.arc(city.x, city.y, city.wallRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.setLineDash([14, 8]);
      ctx.beginPath();
      ctx.arc(city.x, city.y, city.wallRadius + 28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(state.gameOver ? 'CITY CAPTURED' : 'CITY CORE', city.x, city.y - 12);
      ctx.font = '16px Arial';
      ctx.fillText(state.gameOver ? 'The city has fallen' : 'Stay inside the blue area', city.x, city.y + 16);

      ctx.fillStyle = '#ffd8d8';
      ctx.font = '18px Arial';
      ctx.fillText(state.gameOver ? 'ALLIES LOST' : 'Attackers approaching!', city.x, city.y + dangerRadius + 30);

      if (state.player.charging) {
        const chargeRatio = state.player.chargeTime / state.player.maxCharge;
        const chargeRadius = 30 + chargeRatio * 20;
        ctx.strokeStyle = `rgba(255, 215, 80, ${0.65 + chargeRatio * 0.25})`;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(state.player.x, state.player.y, chargeRadius, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      const p = state.player;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = '#e6e6e6';
      ctx.beginPath();
      ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
      ctx.fill();

      const dx = state.mouseX - p.x;
      const dy = state.mouseY - p.y;
      const angle = Math.atan2(dy, dx);
      ctx.strokeStyle = '#ffdf66';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(angle) * 24, Math.sin(angle) * 24);
      ctx.stroke();
      ctx.restore();
    }

    function drawBullets() {
      ctx.fillStyle = '#ffd166';
      state.bullets.forEach((b) => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawEnemies() {
      state.enemies.forEach((enemy) => {
        ctx.fillStyle = '#c95b5b';
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(enemy.x - 5, enemy.y - 2, 10, 4);
      });
    }

    function drawAllies() {
      state.allies.forEach((ally) => {
        ctx.fillStyle = '#7bb36b';
        ctx.beginPath();
        ctx.arc(ally.x, ally.y, ally.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#e6f3d1';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(ally.x, ally.y, ally.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      });
    }

    function drawOverlay() {
      if (!state.gameOver) return;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 42px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('The city fell...', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '24px Arial';
      ctx.fillText('Refresh to try again', canvas.width / 2, canvas.height / 2 + 30);
    }

    function loop(time) {
      const dt = Math.min(0.032, (time - state.lastTime) / 1000 || 0.016);
      state.lastTime = time;
      update(dt);
      updateAllies(dt);
      drawBackground();
      drawEnemies();
      drawAllies();
      drawBullets();
      drawPlayer();
      drawOverlay();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
