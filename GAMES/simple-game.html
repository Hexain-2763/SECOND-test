<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siege Survival</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }

    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 14px;
      background: rgba(31,31,31,0.9);
      border-bottom: 2px solid #2d2d2d;
      font-size: 14px;
      backdrop-filter: blur(4px);
      color: #f7f7f7;
    }
    #hud .blue  { color: #4f7ddf; }
    #hud .red   { color: #c95b5b; }

    canvas {
      display: block;
      width: 100vw; height: 100vh;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div>Defend the city</div>
    <div>
      Days: <span id="hud-days">1</span>
      &nbsp;|&nbsp;Time: <span id="hud-time">Dawn</span>
      &nbsp;|&nbsp;Casualties:
      <span class="blue">Blue</span> <span id="hud-blue">0</span>
      &nbsp;:&nbsp;
      <span id="hud-red">0</span> <span class="red">Red</span>
      &nbsp;|&nbsp;Wall HP: <span id="hud-wall">520</span>
      &nbsp;|&nbsp;Charge: <span id="hud-charge">0% • Ready</span>
    </div>
  </div>

  <canvas id="canvas"></canvas>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const hud = {
    days:   document.getElementById('hud-days'),
    time:   document.getElementById('hud-time'),
    blue:   document.getElementById('hud-blue'),
    red:    document.getElementById('hud-red'),
    wall:   document.getElementById('hud-wall'),
    charge: document.getElementById('hud-charge'),
  };

  // ── Initial sizing ──────────────────────────────────────────────────────────
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  // ── State ───────────────────────────────────────────────────────────────────
  const state = {
    mouseX: canvas.width  * 0.8,
    mouseY: canvas.height * 0.8,
    blueCasualties: 0,
    redCasualties:  0,
    bullets:     [],
    enemies:     [],
    allies:      [],
    alliedShots: [],
    territory:   [],
    player: {
      x: canvas.width  / 2,
      y: canvas.height / 2,
      radius: 18,
      speed: 140,
      vx: 0, vy: 0,
      charging: false,
      chargeTime: 0,
      maxCharge: 1.5,
      cooldown: 0,
      maxCooldown: 1.1,
      weapon: 'longbow',
    },
    city: {
      x: canvas.width  / 2,
      y: canvas.height / 2,
      radius: 220,
      wallRadius: 260,
      wallHp: 520,
      wallMaxHp: 520,
      wallsDown: false,
      collapsing: false,
      collapseTimer: 0,
      collapseDuration: 2.2,
    },
    keys: {
      ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
      KeyW: false, KeyA: false, KeyS: false, KeyD: false,
    },
    spawnTimer: 0,
    spawnDelay: 3.0,
    dayTimer: 0,
    dayDuration: 45,
    dayCount: 1,
    timePhase: 'Dawn',
    waveCooldown: 0,
    waveInterval: 18,
    lastTime: 0,
    gameOver: false,
  };

  // ── World-aware resize ──────────────────────────────────────────────────────
  function resizeCanvas() {
    const prevCx = canvas.width  / 2;
    const prevCy = canvas.height / 2;
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    const dx = canvas.width  / 2 - prevCx;
    const dy = canvas.height / 2 - prevCy;
    state.city.x   += dx; state.city.y   += dy;
    state.player.x += dx; state.player.y += dy;
    state.mouseX   += dx; state.mouseY   += dy;
    for (const e of state.enemies)     { e.x += dx; e.y += dy; }
    for (const a of state.allies)      { a.x += dx; a.y += dy; }
    for (const b of state.bullets)     { b.x += dx; b.y += dy; }
    for (const s of state.alliedShots) { s.x += dx; s.y += dy; }
    for (const t of state.territory)   { t.x += dx; t.y += dy; }
  }
  window.addEventListener('resize', resizeCanvas);

  // ── Initialization ──────────────────────────────────────────────────────────
  function createAllies() {
    const count = 12;
    const ringRadius = state.city.wallRadius - 18;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i + Math.random() * 0.2;
      state.allies.push({
        x: state.city.x + Math.cos(angle) * ringRadius,
        y: state.city.y + Math.sin(angle) * ringRadius,
        radius: 14, hp: 14, speed: 72,
        attackCooldown: 0, attackRate: 0.9,
        weapon: 'crossbow', homeAngle: angle, homeRadius: ringRadius,
      });
    }
  }

  function createTerritory() {
    state.territory = [];
    const rings = 10;
    const innerRadius = state.city.radius * 0.2;
    const outerRadius = state.city.radius * 0.95;
    for (let ring = 0; ring < rings; ring++) {
      const radius = innerRadius + ((outerRadius - innerRadius) / (rings - 1)) * ring;
      const count = 10 + ring * 2;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + (ring % 2 === 0 ? 0 : 0.18);
        const jitter = (Math.random() - 0.5) * 14;
        state.territory.push({
          x: state.city.x + Math.cos(angle) * (radius + jitter),
          y: state.city.y + Math.sin(angle) * (radius + jitter),
          owner: 'neutral',
          size: 14 + Math.random() * 8,
        });
      }
    }
  }

  function spawnInitialEnemies() {
    const count = 20;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i + Math.random() * 0.2;
      const spawnRadius = state.city.wallRadius + 90 + Math.random() * 40;
      state.enemies.push({
        x: state.city.x + Math.cos(angle) * spawnRadius,
        y: state.city.y + Math.sin(angle) * spawnRadius,
        radius: 16 + Math.random() * 6, speed: 16 + Math.random() * 4,
        hp: 8, atWall: false, attackTimer: 0, attackRate: 1.8,
        weapon: Math.random() < 0.5 ? 'spear' : 'bow',
        shootCooldown: Math.random() * 2,
      });
    }
  }

  createAllies();
  createTerritory();
  spawnInitialEnemies();

  // ── Shoot ───────────────────────────────────────────────────────────────────
  function shoot() {
    if (state.player.cooldown > 0) return;
    const dx   = state.mouseX - state.player.x;
    const dy   = state.mouseY - state.player.y;
    const dist = Math.hypot(dx, dy) || 1;
    const charge = Math.min(state.player.chargeTime / state.player.maxCharge, 1);
    const power  = 1 + Math.round(charge * 4);
    const speed  = 380 + charge * 120;
    state.bullets.push({
      x: state.player.x, y: state.player.y,
      vx: (dx / dist) * speed, vy: (dy / dist) * speed,
      radius: 4 + charge * 2, life: 2.2, power, isArrow: true,
    });
    state.player.cooldown = state.player.maxCooldown;
  }

  // ── Spawn helpers ───────────────────────────────────────────────────────────
  function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const spawnRadius = state.city.wallRadius + 240 + Math.random() * 120;
    state.enemies.push({
      x: state.city.x + Math.cos(angle) * spawnRadius,
      y: state.city.y + Math.sin(angle) * spawnRadius,
      radius: 16 + Math.random() * 6, speed: 24 + Math.random() * 6,
      hp: 8, atWall: false, attackTimer: 0, attackRate: 1.4,
      weapon: Math.random() < 0.5 ? 'spear' : 'bow',
      shootCooldown: Math.random() * 2,
    });
  }

  function spawnWave() {
    const waveSize = 6 + state.dayCount * 2;
    for (let i = 0; i < waveSize; i++) spawnEnemy();
    state.waveCooldown = state.waveInterval;
  }

  // ── HUD update ──────────────────────────────────────────────────────────────
  function updateHud() {
    hud.blue.textContent   = String(state.blueCasualties);
    hud.red.textContent    = String(state.redCasualties);
    hud.days.textContent   = String(state.dayCount);
    hud.time.textContent   = state.timePhase;
    hud.wall.textContent   = String(Math.max(0, Math.ceil(state.city.wallHp)));
    const bowReady = state.player.cooldown <= 0;
    hud.charge.textContent =
      Math.round((state.player.chargeTime / state.player.maxCharge) * 100) + '%' +
      (bowReady ? ' • Ready' : ' • ' + state.player.cooldown.toFixed(2) + 's');
  }

  // ── Update ──────────────────────────────────────────────────────────────────
  function update(dt) {
    if (state.gameOver) return;
    state.spawnTimer   += dt;
    state.dayTimer     += dt;
    state.waveCooldown  = Math.max(0, state.waveCooldown - dt);

    if (state.dayTimer >= state.dayDuration) {
      state.dayTimer = 0;
      state.dayCount += 1;
      if      (state.timePhase === 'Dawn')  state.timePhase = 'Day';
      else if (state.timePhase === 'Day')   state.timePhase = 'Dusk';
      else if (state.timePhase === 'Dusk')  state.timePhase = 'Night';
      else                                  state.timePhase = 'Dawn';
    }

    if (!state.city.collapsing && state.waveCooldown <= 0) spawnWave();

    // Player bullets
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;

      const dxC = state.city.x - b.x;
      const dyC = state.city.y - b.y;
      const distC = Math.hypot(dxC, dyC);
      const wallHitRadius = state.city.wallRadius + 12;
      if (distC <= wallHitRadius && !state.city.wallsDown && Math.random() < 0.25) {
        b.vx *= 0.55; b.vy *= 0.55;
        b.y  -= 18;
        b.life = Math.min(b.life, 0.7);
      }

      if (b.life <= 0 || b.x < -20 || b.x > canvas.width + 20 || b.y < -20 || b.y > canvas.height + 20) {
        state.bullets.splice(i, 1); continue;
      }

      let hit = false;
      for (let j = state.enemies.length - 1; j >= 0; j--) {
        const en = state.enemies[j];
        if (Math.hypot(b.x - en.x, b.y - en.y) <= b.radius + en.radius) {
          en.hp -= b.power;
          state.bullets.splice(i, 1);
          if (en.hp <= 0) { state.enemies.splice(j, 1); state.redCasualties += 1; }
          hit = true; break;
        }
      }
      if (hit) continue;
    }

    // Enemies
    for (let i = state.enemies.length - 1; i >= 0; i--) {
      const en = state.enemies[i];
      const dx   = state.city.x - en.x;
      const dy   = state.city.y - en.y;
      const dist = Math.hypot(dx, dy) || 1;
      const wallDist = state.city.wallRadius + en.radius;

      if (!state.city.wallsDown && !en.atWall && dist <= wallDist) {
        en.atWall = true;
        en.x = state.city.x - (dx / dist) * wallDist;
        en.y = state.city.y - (dy / dist) * wallDist;
        en.attackTimer = 0;
      }

      if (!en.atWall || state.city.wallsDown) {
        en.x += (dx / dist) * en.speed * dt;
        en.y += (dy / dist) * en.speed * dt;
      }

      let enemyHitAlly = false;
      for (let j = state.allies.length - 1; j >= 0; j--) {
        const al = state.allies[j];
        const adist = Math.hypot(al.x - en.x, al.y - en.y) || 1;
        if (adist <= en.radius + al.radius) {
          al.hp -= 18 * dt;
          en.hp  -=  9 * dt;
          enemyHitAlly = true;
          if (al.hp <= 0) { state.allies.splice(j, 1); state.blueCasualties += 1; }
        }
      }

      if (en.hp <= 0) { state.enemies.splice(i, 1); state.redCasualties += 1; continue; }

      if (!state.city.wallsDown && en.atWall && !enemyHitAlly && Math.random() < 0.7) {
        en.attackTimer += dt;
        if (en.attackTimer >= en.attackRate) {
          en.attackTimer = 0;
          if (!state.city.wallsDown) {
            state.city.wallHp -= 4;
            if (state.city.wallHp <= 0) { state.city.wallHp = 0; state.city.wallsDown = true; }
          }
        }
      }

      // Bow enemies shoot at nearby targets with a proper cooldown
      if (en.weapon === 'bow') {
        en.shootCooldown = Math.max(0, en.shootCooldown - dt);
        if (en.shootCooldown <= 0) {
          const BOW_RANGE = 180;
          let bestTarget = null;
          let bestDist   = BOW_RANGE;
          const pd = Math.hypot(state.player.x - en.x, state.player.y - en.y);
          if (pd <= bestDist) { bestDist = pd; bestTarget = state.player; }
          for (const al of state.allies) {
            const d = Math.hypot(al.x - en.x, al.y - en.y);
            if (d < bestDist) { bestDist = d; bestTarget = al; }
          }
          if (bestTarget) {
            const tx = bestTarget.x - en.x;
            const ty = bestTarget.y - en.y;
            const td = Math.hypot(tx, ty) || 1;
            state.alliedShots.push({
              x: en.x, y: en.y,
              vx: (tx / td) * 200, vy: (ty / td) * 200,
              radius: 3, life: 1.2, isArrow: true, fromEnemy: true,
            });
            en.shootCooldown = 1.8 + Math.random() * 0.6;
          }
        }
      }
    }

    // Player movement
    const inputX = (state.keys['ArrowRight'] || state.keys['KeyD'] ? 1 : 0) - (state.keys['ArrowLeft'] || state.keys['KeyA'] ? 1 : 0);
    const inputY = (state.keys['ArrowDown']  || state.keys['KeyS'] ? 1 : 0) - (state.keys['ArrowUp']   || state.keys['KeyW'] ? 1 : 0);
    const inputLen = Math.hypot(inputX, inputY) || 1;
    state.player.vx = (inputX / inputLen) * state.player.speed;
    state.player.vy = (inputY / inputLen) * state.player.speed;
    state.player.x += state.player.vx * dt;
    state.player.y += state.player.vy * dt;

    // Keep player inside city
    const pdx  = state.player.x - state.city.x;
    const pdy  = state.player.y - state.city.y;
    const pDist = Math.hypot(pdx, pdy);
    const maxDist = state.city.radius - state.player.radius - 3;
    if (pDist > maxDist) {
      const scale = maxDist / pDist;
      state.player.x = state.city.x + pdx * scale;
      state.player.y = state.city.y + pdy * scale;
    }

    if (state.player.cooldown > 0) state.player.cooldown = Math.max(0, state.player.cooldown - dt);
    if (state.player.charging)     state.player.chargeTime = Math.min(state.player.chargeTime + dt, state.player.maxCharge);

    if (state.city.collapsing) {
      state.city.collapseTimer += dt;
      if (state.city.collapseTimer >= state.city.collapseDuration) state.gameOver = true;
    }

    updateHud();
  }

  // ── Allies ──────────────────────────────────────────────────────────────────
  function updateAllies(dt) {
    for (let i = state.allies.length - 1; i >= 0; i--) {
      const al = state.allies[i];
      if (al.hp <= 0) { state.allies.splice(i, 1); continue; }
      if (al.attackCooldown > 0) al.attackCooldown -= dt;

      let target = null, nearest = Infinity;
      for (const en of state.enemies) {
        const d = Math.hypot(en.x - al.x, en.y - al.y);
        const fromWall = Math.hypot(en.x - state.city.x, en.y - state.city.y);
        if (d < nearest && fromWall < state.city.wallRadius + 80) { nearest = d; target = en; }
      }

      if (target) {
        const dx   = target.x - al.x;
        const dy   = target.y - al.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist > al.radius + target.radius + 70) {
          al.x += (dx / dist) * al.speed * dt;
          al.y += (dy / dist) * al.speed * dt;
        }
        if (dist <= al.radius + target.radius + 90 && al.attackCooldown <= 0) {
          const sd = Math.hypot(target.x - al.x, target.y - al.y) || 1;
          state.alliedShots.push({
            x: al.x, y: al.y,
            vx: ((target.x - al.x) / sd) * 220, vy: ((target.y - al.y) / sd) * 220,
            radius: 3, life: 0.75, isArrow: true,
          });
          al.attackCooldown = al.attackRate;
        }
      } else {
        const homeX = state.city.x + Math.cos(al.homeAngle) * al.homeRadius;
        const homeY = state.city.y + Math.sin(al.homeAngle) * al.homeRadius;
        const dx    = homeX - al.x;
        const dy    = homeY - al.y;
        const dist  = Math.hypot(dx, dy) || 1;
        if (dist > 8) { al.x += (dx / dist) * al.speed * 0.7 * dt; al.y += (dy / dist) * al.speed * 0.7 * dt; }
      }

      // Keep ally inside wall
      const dx   = al.x - state.city.x;
      const dy   = al.y - state.city.y;
      const dist = Math.hypot(dx, dy);
      const maxD = state.city.wallRadius - 16;
      if (dist > maxD) { const s = maxD / dist; al.x = state.city.x + dx * s; al.y = state.city.y + dy * s; }
    }
  }

  function updateAlliedShots(dt) {
    for (let i = state.alliedShots.length - 1; i >= 0; i--) {
      const s = state.alliedShots[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0) { state.alliedShots.splice(i, 1); continue; }

      const targets = s.fromEnemy ? state.allies : state.enemies;
      let hit = false;
      for (let j = targets.length - 1; j >= 0; j--) {
        const t = targets[j];
        if (Math.hypot(s.x - t.x, s.y - t.y) <= s.radius + t.radius) {
          t.hp -= s.fromEnemy ? 2 : 3;
          state.alliedShots.splice(i, 1);
          if (t.hp <= 0) {
            if (s.fromEnemy) { state.allies.splice(j, 1);  state.blueCasualties += 1; }
            else             { state.enemies.splice(j, 1); state.redCasualties  += 1; }
          }
          hit = true; break;
        }
      }
      if (hit) continue;
    }
  }

  function updateTerritory() {
    if (!state.city.wallsDown) { state.territory.forEach(c => c.owner = 'blue'); return; }
    state.territory.forEach(cell => {
      let blue = 0, red = 0;
      const inf = 44;
      for (const al of state.allies)  if (Math.hypot(al.x - cell.x, al.y - cell.y) < inf) blue++;
      for (const en of state.enemies) if (Math.hypot(en.x - cell.x, en.y - cell.y) < inf) red++;
      if      (red  > blue + 1)             cell.owner = 'red';
      else if (blue > red  + 1)             cell.owner = 'blue';
      else if (red > 0 || blue > 0)         cell.owner = 'neutral';
      else                                  cell.owner = 'neutral';
    });
    const redCells = state.territory.filter(c => c.owner === 'red').length;
    if (redCells / state.territory.length >= 0.6) state.gameOver = true;
  }

  // ── Draw ────────────────────────────────────────────────────────────────────
  function drawBackground() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#2b1515';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const city = state.city;
    const dangerRadius = city.wallRadius + 24;
    const baseColor  = (state.gameOver || city.collapsing) ? '#e25656' : '#d24545';
    const innerColor = (state.gameOver || city.collapsing) ? '#d13f3f' : '#dc5454';
    const wallStroke = (state.gameOver || city.collapsing) ? '#7b2727' : '#1b3f76';
    const collapseRatio = city.collapsing ? Math.min(1, city.collapseTimer / city.collapseDuration) : 0;

    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.arc(city.x, city.y, dangerRadius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = innerColor;
    ctx.beginPath(); ctx.arc(city.x, city.y, city.wallRadius, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#2b5cbc';
    ctx.beginPath();
    const segments = 18;
    for (let i = 0; i <= segments; i++) {
      const angle  = (Math.PI * 2 / segments) * i;
      const radius = city.radius + Math.sin(i * 1.3) * 12 + Math.cos(i * 1.7) * 8;
      const px = city.x + Math.cos(angle) * radius;
      const py = city.y + Math.sin(angle) * radius;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();

    if (collapseRatio > 0) {
      ctx.fillStyle = `rgba(196,39,39,${collapseRatio * 0.85})`;
      ctx.beginPath();
      for (let i = 0; i <= segments; i++) {
        const angle  = (Math.PI * 2 / segments) * i;
        const radius = city.radius + Math.sin(i * 1.3) * 12 + Math.cos(i * 1.7) * 8;
        const px = city.x + Math.cos(angle) * radius;
        const py = city.y + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    }

    ctx.strokeStyle = wallStroke; ctx.lineWidth = 14;
    ctx.beginPath(); ctx.arc(city.x, city.y, city.wallRadius, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.setLineDash([14, 8]);
    ctx.beginPath(); ctx.arc(city.x, city.y, city.wallRadius + 28, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
    ctx.fillText(state.gameOver ? 'CITY CAPTURED' : 'CITY CORE', city.x, city.y - 12);
    ctx.font = '16px Arial';
    ctx.fillText(state.gameOver ? 'The city has fallen' : 'Stay inside the blue area', city.x, city.y + 16);
    ctx.fillStyle = '#ffd8d8'; ctx.font = '18px Arial';
    ctx.fillText(state.gameOver ? 'ALLIES LOST' : 'Attackers approaching!', city.x, city.y + dangerRadius + 30);

    if (state.player.charging) {
      const cr = state.player.chargeTime / state.player.maxCharge;
      ctx.strokeStyle = `rgba(255,215,80,${0.65 + cr * 0.25})`; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(state.player.x, state.player.y, 30 + cr * 20, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawPlayer() {
    const p     = state.player;
    const angle = Math.atan2(state.mouseY - p.y, state.mouseX - p.x);
    ctx.save();
    ctx.translate(p.x, p.y);

    // Body (doesn't rotate)
    ctx.fillStyle = '#e6e6e6';
    ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.fill();

    // Rotate so bow faces cursor
    ctx.rotate(angle);

    // Bow stave
    ctx.fillStyle = '#3c2a1a';
    ctx.fillRect(-2, -12, 4, 24);

    // Bow string
    ctx.strokeStyle = '#c7a36a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(8, 0); ctx.lineTo(0, 12); ctx.stroke();

    // Nocked arrow (visible while charging)
    const charge = Math.min(p.chargeTime / p.maxCharge, 1);
    if (p.charging) {
      ctx.strokeStyle = `rgba(200,161,77,${0.5 + charge * 0.5})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(14 + charge * 6, 0); ctx.stroke();
    }

    ctx.restore();
  }

  function drawBullets() {
    state.bullets.forEach(b => {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.fillStyle = '#c8a14d';
      ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(10, 0); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7a4b1d'; ctx.fillRect(-3, -1.5, 4, 3);
      ctx.restore();
    });
  }

  function drawAlliedShots() {
    state.alliedShots.forEach(s => {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
      ctx.strokeStyle = s.fromEnemy ? '#8a2d2d' : '#86c5ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(8, 0); ctx.stroke();
      ctx.fillStyle = s.fromEnemy ? '#b85656' : '#4b8fd1';
      ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  function drawTerritory() {
    state.territory.forEach(cell => {
      ctx.fillStyle =
        cell.owner === 'blue'    ? 'rgba(77,125,255,0.28)' :
        cell.owner === 'red'     ? 'rgba(255,92,92,0.28)'  :
                                   'rgba(255,255,255,0.08)';
      ctx.fillRect(cell.x - cell.size / 2, cell.y - cell.size / 2, cell.size, cell.size);
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.strokeRect(cell.x - cell.size / 2, cell.y - cell.size / 2, cell.size, cell.size);
    });
  }

  function drawSoldier(x, y, radius, bodyColor, rimColor, helmetColor, weapon) {
    ctx.save();
    ctx.translate(x, y);

    // Body
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

    // Rim
    ctx.strokeStyle = rimColor; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.stroke();

    // Helmet — semicircle on top
    ctx.fillStyle = helmetColor;
    ctx.beginPath();
    ctx.arc(0, -radius * 0.35, radius * 0.52, Math.PI, 0);
    ctx.closePath();
    ctx.fill();

    // Weapon indicator
    ctx.strokeStyle = '#8c5a2b'; ctx.lineWidth = 2.5;
    if (weapon === 'bow') {
      ctx.beginPath();
      ctx.arc(radius * 0.3, 0, radius * 0.55, -Math.PI * 0.7, Math.PI * 0.7);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(radius * 0.3, -radius * 0.55);
      ctx.lineTo(radius * 0.3,  radius * 0.55);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(radius * 0.1,  radius * 0.3);
      ctx.lineTo(radius * 0.85, -radius * 0.85);
      ctx.stroke();
      ctx.fillStyle = '#c0c0c0';
      ctx.beginPath(); ctx.arc(radius * 0.85, -radius * 0.85, 2.5, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
  }

  function drawEnemies() {
    state.enemies.forEach(e => drawSoldier(e.x, e.y, e.radius, '#c95b5b', '#7a2020', '#8b2222', e.weapon));
  }

  function drawAllies() {
    state.allies.forEach(a => drawSoldier(a.x, a.y, a.radius, '#4f7ddf', '#1a3f8f', '#2a4faf', 'bow'));
  }

  function drawOverlay() {
    if (!state.gameOver) return;
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 42px Arial'; ctx.textAlign = 'center';
    ctx.fillText('The city fell...', canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '24px Arial';
    ctx.fillText('Refresh to play again', canvas.width / 2, canvas.height / 2 + 30);
  }

  // ── Game loop ───────────────────────────────────────────────────────────────
  function loop(time) {
    const dt = Math.min(0.032, (time - state.lastTime) / 1000 || 0.016);
    state.lastTime = time;
    update(dt);
    if (!state.gameOver) {
      updateAllies(dt);
      updateAlliedShots(dt);
      updateTerritory();
    }
    drawBackground();
    drawTerritory();
    drawEnemies();
    drawAllies();
    drawAlliedShots();
    drawBullets();
    drawPlayer();
    drawOverlay();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ── Input ───────────────────────────────────────────────────────────────────
  window.addEventListener('mousemove', e => {
    state.mouseX = e.clientX;
    state.mouseY = e.clientY;
  });

  canvas.addEventListener('mousedown', e => {
    state.mouseX = e.clientX; state.mouseY = e.clientY;
    if (e.button === 0 && !state.gameOver) state.player.charging = true;
  });

  window.addEventListener('mouseup', e => {
    state.mouseX = e.clientX; state.mouseY = e.clientY;
    if (e.button === 0 && state.player.charging && !state.gameOver) shoot();
    if (e.button === 0) { state.player.charging = false; state.player.chargeTime = 0; }
  });

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (!state.gameOver) state.player.charging = true; }
    if (e.code in state.keys) state.keys[e.code] = true;
  });

  window.addEventListener('keyup', e => {
    if (e.code === 'Space' && state.player.charging && !state.gameOver) {
      shoot(); state.player.charging = false; state.player.chargeTime = 0;
    }
    if (e.code in state.keys) state.keys[e.code] = false;
  });

})();
</script>
</body>
</html>
